<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRROR</title>
    <style>
      :root {
        --neon: #ff7300;
        --black: #000000;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 12px;
        background: var(--black);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        color: var(--neon);
      }

      body.dragging {
        background: #001a00;
        outline: 4px solid var(--neon);
        outline-offset: -4px;
      }

      #controls {
        width: 100%;
        background: var(--black);
        padding: 3px;
        border-bottom: 1px solid var(--neon);
        display: flex;
        flex-direction: row;
        gap: 12px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        flex-shrink: 0;
      }

      .file-input-wrapper {
        position: relative;
        overflow: hidden;
        display: inline-block;
      }

      #imageInput {
        position: absolute;
        left: -9999px;
      }

      .file-input-label {
        display: block;
        padding: 4px;
        background: var(--black);
        color: var(--neon);
        font-weight: 700;
        font-size: inherit;
        border: 1px solid var(--neon);
        cursor: pointer;
        transition: all 0.1s;
        text-transform: uppercase;
      }

      .file-input-label:hover {
        background: var(--neon);
        color: var(--black);
      }

      #modeToggle, #edgeToggle {
        display: flex;
        flex-wrap: nowrap;
        gap: 5px;
        align-items: center;
      }

      .mode-btn {
        padding: 4px 8px;
        background: var(--black);
        border: 1px solid var(--neon);
        color: var(--neon);
        font-weight: 400;
        font-size: inherit;
        cursor: pointer;
        transition: all 0.1s;
        text-transform: uppercase;
        font-family: 'JetBrains Mono', monospace;
        white-space: nowrap;
      }

      .mode-btn:hover {
        background: var(--neon);
        color: var(--black);
      }

      .mode-btn.active {
        background: var(--neon);
        color: var(--black);
      }

      #zoomControl, #segmentsControl, #biasControl {
        display: flex;
        flex-direction: row;
        gap: 5px;
        align-items: center;
      }

      #zoomControl label, #segmentsControl label, #biasControl label {
        font-size: inherit;
        text-transform: uppercase;
        color: var(--neon);
        white-space: nowrap;
      }

      .editable-value {
        cursor: pointer;
        border-bottom: 1px dashed var(--neon);
        pointer-events: auto;
      }

      .editable-value:hover {
        background: var(--neon);
        color: var(--black);
      }

      .value-input {
        width: 4em;
        background: var(--black);
        color: var(--neon);
        border: 1px solid var(--neon);
        font-family: inherit;
        font-size: inherit;
        padding: 0 2px;
        text-align: center;
        user-select: text;
        -webkit-user-select: text;
      }

      #zoomSlider, #segmentsSlider, #biasSlider {
        width: 100px;
        height: 2px;
        background: var(--neon);
        outline: none;
        -webkit-appearance: none;
        appearance: none;
      }

      #zoomSlider::-webkit-slider-thumb, #segmentsSlider::-webkit-slider-thumb, #biasSlider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px;
        height: 12px;
        background: var(--neon);
        cursor: pointer;
        border: none;
      }

      #zoomSlider::-moz-range-thumb, #segmentsSlider::-moz-range-thumb, #biasSlider::-moz-range-thumb {
        width: 12px;
        height: 12px;
        background: var(--neon);
        cursor: pointer;
        border: none;
      }

      #canvasContainer {
        position: relative;
        border: 1px solid var(--neon);
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #glCanvas {
        display: block;
        max-width: 100vw;
        max-height: 100%;
        background: var(--black);
      }

      #lineOverlay {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
      }

      #instructionOverlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: var(--neon);
        text-transform: uppercase;
        pointer-events: none;
        opacity: 1;
        text-align: center;
        padding: 10px 20px;
        border: 1px solid var(--neon);
        background: rgba(0, 0, 0, 0.9);
        user-select: none;
        -webkit-user-select: none;
      }

      .hidden {
        display: none;
      }

      .mode-group {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 5px;
      }

      .mode-icon {
        display: flex;
        align-items: center;
        gap: 3px;
        text-transform: uppercase;
        font-size: 10px;
        opacity: 0.7;
      }

      .mode-icon svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
      }

    </style>
</head>
<body>
<div id="controls">
    <div class="file-input-wrapper">
        <input type="file" id="imageInput" accept="image/*">
        <label for="imageInput" class="file-input-label">Choose image</label>
    </div>
    <div class="mode-group">
        <div class="mode-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 2 L12 22 M8 6 L12 2 L16 6 M16 18 L12 22 L8 18"/>
            </svg>
            [M]
        </div>
        <div id="modeToggle">
            <button id="outInBtn" class="mode-btn active">Out → In</button>
            <button id="inOutBtn" class="mode-btn">In → Out</button>
            <button id="quadInBtn" class="mode-btn">Quad In</button>
            <button id="quadOutBtn" class="mode-btn">Quad Out</button>
            <button id="kaleidoBtn" class="mode-btn">Kaleido</button>
        </div>
    </div>
    <div id="segmentsControl" style="display: none;">
        <label for="segmentsSlider">Segments: <span id="segmentsValue" class="editable-value">6</span></label>
        <input type="range" id="segmentsSlider" min="2" max="16" step="1" value="6">
    </div>
    <div class="mode-group">
        <div class="mode-icon">
            <svg viewBox="0 0 24 24">
                <rect x="4" y="4" width="16" height="16"/>
                <path d="M4 4 L2 2 M20 4 L22 2 M4 20 L2 22 M20 20 L22 22"/>
            </svg>
            [E]
        </div>
        <div id="edgeToggle">
            <button id="edgeClampBtn" class="mode-btn active">Clamp</button>
            <button id="edgeWrapBtn" class="mode-btn">Wrap</button>
            <button id="edgeMirrorBtn" class="mode-btn">Mirror</button>
        </div>
    </div>
    <div id="zoomControl">
        <label for="zoomSlider">Zoom: <span id="zoomValue" class="editable-value">1.0</span>x</label>
        <input type="range" id="zoomSlider" min="0.1" max="5.0" step="0.1" value="1.0">
    </div>
    <div id="biasControl">
        <label for="biasSlider">Bias: <span id="biasValue" class="editable-value">&nbsp;0.00</span></label>
        <input type="range" id="biasSlider" min="-2" max="2" step="0.01" value="0">
    </div>
    <div class="mode-group">
        <div class="mode-icon">
            <svg viewBox="0 0 24 24">
                <path d="M4 20 L20 4"/>
            </svg>
            [B]
        </div>
        <div id="biasModeToggle">
            <button id="biasLinearBtn" class="mode-btn active">Linear</button>
            <button id="biasSqrtBtn" class="mode-btn">Sqrt</button>
            <button id="biasPowBtn" class="mode-btn">Pow</button>
            <button id="biasSineBtn" class="mode-btn">Sine</button>
        </div>
    </div>
    <div class="mode-group">
        <div class="mode-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 3 L12 21 M3 12 L21 12"/>
                <path d="M12 3 A9 9 0 0 1 21 12" stroke-dasharray="2,2"/>
            </svg>
            [S]
        </div>
        <div id="straightenToggle">
            <button id="straightenOffBtn" class="mode-btn active">Off</button>
            <button id="straightenHorizBtn" class="mode-btn">Horiz</button>
            <button id="straightenVertBtn" class="mode-btn">Vert</button>
            <button id="straightenAutoBtn" class="mode-btn">Auto</button>
        </div>
    </div>
</div>

<div id="canvasContainer">
    <canvas id="glCanvas" width="800" height="600"></canvas>
    <canvas id="lineOverlay" width="800" height="600"></canvas>
    <div id="instructionOverlay">Drop an image here</div>
</div>

<!-- Vertex Shader -->
<script id="vertex-shader" type="x-shader/x-vertex">
    attribute vec2 a_position;
    attribute vec2 a_texCoord;

    varying vec2 v_texCoord;

    void main() {
        gl_Position = vec4(a_position, 0.0, 1.0);
        v_texCoord = a_texCoord;
    }
</script>

<!-- Fragment Shader -->
<script id="fragment-shader" type="x-shader/x-fragment">
    precision highp float;

    uniform sampler2D u_image;
    uniform vec2 u_lineStart;
    uniform vec2 u_lineEnd;
    uniform vec2 u_canvasSize;
    uniform int u_mirrorMode;
    uniform int u_edgeMode;
    uniform float u_zoom;
    uniform float u_bias;
    uniform int u_biasMode;
    uniform float u_rotationAngle;
    uniform int u_kaleidoSegments;
    uniform bool u_hasLine;
    uniform vec2 u_centerOffset;

    // Apply bias curve based on mode
    float applyBias(float x, float bias) {
        if (bias == 1.0) return x;

        // Mode 0: Linear (power curve)
        if (u_biasMode == 0) {
            return pow(x, bias);
        }
        // Mode 1: Sqrt (gentler curve)
        else if (u_biasMode == 1) {
            if (bias > 1.0) {
                return 1.0 - sqrt(1.0 - x * x);
            } else {
                return sqrt(1.0 - (1.0 - x) * (1.0 - x));
            }
        }
        // Mode 2: Pow (sharper exponential)
        else if (u_biasMode == 2) {
            float t = bias > 1.0 ? bias * bias : 1.0 / (bias * bias);
            return pow(x, t);
        }
        // Mode 3: Sine (smooth S-curve)
        else if (u_biasMode == 3) {
            float curved = 0.5 - 0.5 * cos(x * 3.14159265);
            return mix(x, curved, abs(bias - 1.0) / bias);
        }

        return pow(x, bias);
    }

    varying vec2 v_texCoord;

    void main() {
        if (!u_hasLine) {
            gl_FragColor = texture2D(u_image, v_texCoord);
            return;
        }

        // Convert current texture coordinate to pixel space (square space)
        vec2 currentPixel = v_texCoord * u_canvasSize;

        // Apply center offset (for centering kaleido in viewport with AUTO mode)
        currentPixel = currentPixel - u_centerOffset;

        // Line coordinates are already in pixel space
        vec2 lineVec = u_lineEnd - u_lineStart;
        float lineLength = length(lineVec);

        if (lineLength < 0.1) {
            gl_FragColor = texture2D(u_image, v_texCoord);
            return;
        }

        // Calculate line direction and perpendicular normal in pixel space
        vec2 lineDir = lineVec / lineLength;
        vec2 lineNormal = vec2(-lineDir.y, lineDir.x);
        vec2 lineMidpoint = (u_lineStart + u_lineEnd) / 2.0;

        // Apply rotation if straighten is enabled (rotation around line midpoint)
        if (u_rotationAngle != 0.0) {
            vec2 offset = currentPixel - lineMidpoint;
            float cosAngle = cos(u_rotationAngle);
            float sinAngle = sin(u_rotationAngle);
            currentPixel = lineMidpoint + vec2(
                cosAngle * offset.x - sinAngle * offset.y,
                sinAngle * offset.x + cosAngle * offset.y
            );
        }

        // Apply zoom centered on the line midpoint
        vec2 offset = currentPixel - lineMidpoint;
        currentPixel = lineMidpoint + offset / u_zoom;

        // Calculate signed distance from current pixel to primary line
        float dist = dot(currentPixel - u_lineStart, lineNormal);

        vec2 workingPixel = currentPixel;

        // Mode 0: Out → In, Mode 1: In → Out (simple mirror)
        // Mode 2: Quad In, Mode 3: Quad Out
        // Mode 4: Kaleidoscope
        bool isKaleidoMode = (u_mirrorMode == 4);
        bool isQuadMode = (u_mirrorMode >= 2 && u_mirrorMode <= 3);

        if (isKaleidoMode) {
            // Kaleidoscope mode: angular mirroring around center point
            vec2 center = lineMidpoint;
            vec2 fromCenter = currentPixel - center;
            float radius = length(fromCenter);

            // Apply bias to radius (nonlinear distortion)
            if (u_bias != 1.0 && radius > 0.0) {
                float maxRadius = length(u_canvasSize) * 0.5;
                float normalizedRadius = radius / maxRadius;
                radius = applyBias(normalizedRadius, u_bias) * maxRadius;
            }

            // Calculate angle, using line angle as rotation offset
            float angle = atan(fromCenter.y, fromCenter.x) - lineDir.x * atan(lineDir.y, lineDir.x);

            // Mirror angle into first segment
            float segmentAngle = 6.283185307 / float(u_kaleidoSegments); // 2*PI / segments
            angle = mod(angle, segmentAngle * 2.0);

            // Mirror within the segment
            if (angle > segmentAngle) {
                angle = segmentAngle * 2.0 - angle;
            }

            // Add back the rotation offset
            angle += atan(lineDir.y, lineDir.x);

            // Convert back to cartesian
            workingPixel = center + vec2(cos(angle), sin(angle)) * radius;
        } else if (!isQuadMode) {
            // Simple mirror modes (0 and 1)
            bool shouldMirror = false;
            if (u_mirrorMode == 0) {
                shouldMirror = (dist > 0.0);
            } else {
                shouldMirror = (dist < 0.0);
            }

            if (shouldMirror) {
                workingPixel = currentPixel - 2.0 * dist * lineNormal;
            }
        } else {
            // Quad mirror modes
            // First, mirror across primary line based on mode
            if (u_mirrorMode == 2) {
                // Quad In: mirror negative side to positive
                if (dist < 0.0) {
                    workingPixel = currentPixel - 2.0 * dist * lineNormal;
                }
            } else if (u_mirrorMode == 3) {
                // Quad Out: mirror positive side to negative
                if (dist > 0.0) {
                    workingPixel = currentPixel - 2.0 * dist * lineNormal;
                }
            }

            // Now mirror across perpendicular axis through midpoint
            float perpDist = dot(workingPixel - lineMidpoint, lineDir);

            if (u_mirrorMode == 3) {
                // Mirror positive perpendicular side to negative
                if (perpDist > 0.0) {
                    workingPixel = workingPixel - 2.0 * perpDist * lineDir;
                }
            } else if (u_mirrorMode == 2) {
                // Mirror negative perpendicular side to positive
                if (perpDist < 0.0) {
                    workingPixel = workingPixel - 2.0 * perpDist * lineDir;
                }
            }
        }

        // Apply bias for non-kaleidoscope modes (distort distance from line)
        if (!isKaleidoMode && u_bias != 1.0) {
            float finalDist = dot(workingPixel - lineMidpoint, lineNormal);
            float maxDist = length(u_canvasSize) * 0.5;
            float normalizedDist = abs(finalDist) / maxDist;
            float biasedDist = applyBias(normalizedDist, u_bias) * maxDist * sign(finalDist);
            workingPixel = workingPixel + (biasedDist - finalDist) * lineNormal;
        }

        // Convert back to texture coordinates
        vec2 sampleCoord = workingPixel / u_canvasSize;

        // Apply edge mode
        // Mode 0: Clamp, Mode 1: Wrap, Mode 2: Mirror
        if (u_edgeMode == 0) {
            // Clamp
            sampleCoord = clamp(sampleCoord, 0.0, 1.0);
        } else if (u_edgeMode == 1) {
            // Wrap
            sampleCoord = fract(sampleCoord);
        } else if (u_edgeMode == 2) {
            // Mirror
            sampleCoord = 1.0 - abs(mod(sampleCoord, 2.0) - 1.0);
        }

        gl_FragColor = texture2D(u_image, sampleCoord);
    }
</script>

<script>
  const appState = {
    gl: null,
    program: null,
    image: null,
    texture: null,

    lineStart: null,
    lineEnd: null,
    isDrawingLine: false,
    hasLine: false,

    mirrorMode: 0, // 0=out-in, 1=in-out, 2=quad-in, 3=quad-out, 4=kaleidoscope
    edgeMode: 0,
    zoom: 1.0,
    bias: 0, // Slider value; transformed to 2^bias for shader
    biasMode: 0, // 0=linear, 1=sqrt, 2=pow, 3=sine
    straightenMode: 0, // 0=off, 1=horizontal, 2=vertical, 3=auto
    kaleidoSegments: 6,

    uniforms: {},

    canvasWidth: 0,
    canvasHeight: 0
  };

  function compileShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);

    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      console.error('Shader compilation error:', gl.getShaderInfoLog(shader));
      gl.deleteShader(shader);
      return null;
    }
    return shader;
  }

  function createProgram(gl, vertexShader, fragmentShader) {
    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);

    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      console.error('Program linking error:', gl.getProgramInfoLog(program));
      return null;
    }
    return program;
  }

  function setupGeometry(gl, program) {
    const positions = new Float32Array([
      -1, -1,
      1, -1,
      -1, 1,
      1, 1
    ]);

    const texCoords = new Float32Array([
      0, 0,
      1, 0,
      0, 1,
      1, 1
    ]);

    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

    const positionLoc = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(positionLoc);
    gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

    const texCoordBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, texCoordBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, texCoords, gl.STATIC_DRAW);

    const texCoordLoc = gl.getAttribLocation(program, 'a_texCoord');
    gl.enableVertexAttribArray(texCoordLoc);
    gl.vertexAttribPointer(texCoordLoc, 2, gl.FLOAT, false, 0, 0);
  }

  function loadImage(file) {
    const reader = new FileReader();
    reader.onload = function (e) {
      const img = new Image();
      img.onload = function () {
        appState.image = img;
        resizeCanvasToImage(img);
        createTexture(appState.gl, img);

        appState.hasLine = false;
        appState.lineStart = null;
        appState.lineEnd = null;

        // Show instruction overlay with draw line text
        const overlay = document.getElementById('instructionOverlay');
        overlay.textContent = 'Drag to draw mirror line';
        overlay.classList.remove('hidden');

        render();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function createTexture(gl, image) {
    if (appState.texture) {
      gl.deleteTexture(appState.texture);
    }

    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);

    // Flip Y axis so texture coordinates match WebGL coordinate system
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

    appState.texture = texture;
  }

  function resizeCanvasToImage(img) {
    const canvas = document.getElementById('glCanvas');
    const overlay = document.getElementById('lineOverlay');
    const controls = document.getElementById('controls');
    const controlsHeight = controls.getBoundingClientRect().height;
    const maxWidth = window.innerWidth;
    const maxHeight = window.innerHeight - controlsHeight - 4;

    // Calculate display size (CSS size)
    let displayWidth = img.width;
    let displayHeight = img.height;

    if (displayWidth > maxWidth || displayHeight > maxHeight) {
      const scale = Math.min(maxWidth / displayWidth, maxHeight / displayHeight);
      displayWidth = Math.floor(displayWidth * scale);
      displayHeight = Math.floor(displayHeight * scale);
    }

    // Get device pixel ratio for HiDPI displays
    const dpr = window.devicePixelRatio || 1;

    // Set canvas internal resolution to match display size * DPR (capped at image size)
    const internalWidth = Math.min(Math.floor(displayWidth * dpr), img.width);
    const internalHeight = Math.min(Math.floor(displayHeight * dpr), img.height);

    canvas.width = internalWidth;
    canvas.height = internalHeight;
    overlay.width = internalWidth;
    overlay.height = internalHeight;

    // Set CSS display size
    canvas.style.width = displayWidth + 'px';
    canvas.style.height = displayHeight + 'px';
    overlay.style.width = displayWidth + 'px';
    overlay.style.height = displayHeight + 'px';

    appState.canvasWidth = internalWidth;
    appState.canvasHeight = internalHeight;

    appState.gl.viewport(0, 0, internalWidth, internalHeight);
  }

  function getCanvasCoordinates(canvas, clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    // Convert from CSS pixels to canvas internal pixels
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }

  function setupEventListeners(canvas) {
    document.getElementById('imageInput').addEventListener('change', function (e) {
      if (e.target.files.length > 0) {
        loadImage(e.target.files[0]);
      }
    });

    // Mode button helper function
    function setMirrorMode(mode, buttonId) {
      appState.mirrorMode = mode;
      // Remove active class from mirror mode buttons
      document.querySelectorAll('#modeToggle .mode-btn').forEach(btn => btn.classList.remove('active'));
      // Add active class to clicked button
      document.getElementById(buttonId).classList.add('active');

      // Show/hide segments control based on kaleidoscope mode
      const segmentsControl = document.getElementById('segmentsControl');
      if (mode === 4) {
        segmentsControl.style.display = 'flex';
      } else {
        segmentsControl.style.display = 'none';
      }

      render();
    }

    function setEdgeMode(mode, buttonId) {
      appState.edgeMode = mode;
      // Remove active class from edge mode buttons
      document.querySelectorAll('#edgeToggle .mode-btn').forEach(btn => btn.classList.remove('active'));
      // Add active class to clicked button
      document.getElementById(buttonId).classList.add('active');
      render();
    }

    document.getElementById('outInBtn').addEventListener('click', function () {
      setMirrorMode(0, 'outInBtn');
    });

    document.getElementById('inOutBtn').addEventListener('click', function () {
      setMirrorMode(1, 'inOutBtn');
    });

    document.getElementById('quadInBtn').addEventListener('click', function () {
      setMirrorMode(2, 'quadInBtn');
    });

    document.getElementById('quadOutBtn').addEventListener('click', function () {
      setMirrorMode(3, 'quadOutBtn');
    });

    document.getElementById('kaleidoBtn').addEventListener('click', function () {
      setMirrorMode(4, 'kaleidoBtn');
    });

    document.getElementById('edgeClampBtn').addEventListener('click', function () {
      setEdgeMode(0, 'edgeClampBtn');
    });

    document.getElementById('edgeWrapBtn').addEventListener('click', function () {
      setEdgeMode(1, 'edgeWrapBtn');
    });

    document.getElementById('edgeMirrorBtn').addEventListener('click', function () {
      setEdgeMode(2, 'edgeMirrorBtn');
    });

    // Slider reset helper
    function setupSliderReset(controlId, sliderId, valueId, stateKey, defaultValue, formatFn) {
      const control = document.getElementById(controlId);
      const slider = document.getElementById(sliderId);
      const valueSpan = document.getElementById(valueId);

      function reset() {
        appState[stateKey] = defaultValue;
        slider.value = defaultValue;
        document.getElementById(valueId).textContent = formatFn(defaultValue);
        render();
      }

      function shouldReset(e) {
        // Don't reset if clicking on or inside the editable value
        return !valueSpan.contains(e.target);
      }

      control.addEventListener('dblclick', function (e) {
        if (shouldReset(e)) reset();
      });
      control.addEventListener('click', function (e) {
        if (e.shiftKey && shouldReset(e)) reset();
      });
    }

    setupSliderReset('zoomControl', 'zoomSlider', 'zoomValue', 'zoom', 1.0, v => v.toFixed(1));
    setupSliderReset('biasControl', 'biasSlider', 'biasValue', 'bias', 0, v => {
      if (v > 0) return '+' + v.toFixed(2);
      if (v === 0) return ' 0.00';
      return v.toFixed(2);
    });
    setupSliderReset('segmentsControl', 'segmentsSlider', 'segmentsValue', 'kaleidoSegments', 6, v => v.toString());

    // Editable value click-to-edit
    function setupEditableValue(valueId, sliderId, stateKey, parseFn, formatFn) {
      const valueSpan = document.getElementById(valueId);
      const slider = document.getElementById(sliderId);

      valueSpan.addEventListener('click', function (e) {
        e.stopPropagation();
        if (valueSpan.querySelector('input')) return; // Already editing

        const currentValue = appState[stateKey];
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'value-input';
        input.value = typeof currentValue === 'number' ?
          (Number.isInteger(currentValue) ? currentValue : currentValue.toFixed(2)) : currentValue;

        const originalText = valueSpan.textContent;
        valueSpan.textContent = '';
        valueSpan.appendChild(input);
        input.focus();
        input.select();

        function commit() {
          const newValue = parseFn(input.value);
          if (!isNaN(newValue)) {
            appState[stateKey] = newValue;
            slider.value = Math.max(slider.min, Math.min(slider.max, newValue));
            valueSpan.textContent = formatFn(newValue);
            render();
          } else {
            valueSpan.textContent = originalText;
          }
        }

        function cancel() {
          valueSpan.textContent = originalText;
        }

        input.addEventListener('blur', commit);
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            input.blur();
          } else if (e.key === 'Escape') {
            input.removeEventListener('blur', commit);
            cancel();
          }
        });
      });
    }

    setupEditableValue('zoomValue', 'zoomSlider', 'zoom', parseFloat, v => v.toFixed(1));
    setupEditableValue('biasValue', 'biasSlider', 'bias', parseFloat, v => {
      if (v > 0) return '+' + v.toFixed(2);
      if (v === 0) return ' 0.00';
      return v.toFixed(2);
    });
    setupEditableValue('segmentsValue', 'segmentsSlider', 'kaleidoSegments', parseInt, v => v.toString());

    // Zoom slider
    document.getElementById('zoomSlider').addEventListener('input', function (e) {
      appState.zoom = parseFloat(e.target.value);
      document.getElementById('zoomValue').textContent = appState.zoom.toFixed(1);
      render();
    });

    // Bias slider
    document.getElementById('biasSlider').addEventListener('input', function (e) {
      appState.bias = parseFloat(e.target.value);
      let biasText = appState.bias.toFixed(2);
      if(appState.bias > 0) biasText = "+" + biasText;
      else if(appState.bias === 0) biasText = " 0.00";
      document.getElementById('biasValue').textContent = biasText;
      render();
    });

    // Bias mode buttons
    function setBiasMode(mode, buttonId) {
      appState.biasMode = mode;
      document.querySelectorAll('#biasModeToggle .mode-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(buttonId).classList.add('active');
      render();
    }

    document.getElementById('biasLinearBtn').addEventListener('click', function () {
      setBiasMode(0, 'biasLinearBtn');
    });

    document.getElementById('biasSqrtBtn').addEventListener('click', function () {
      setBiasMode(1, 'biasSqrtBtn');
    });

    document.getElementById('biasPowBtn').addEventListener('click', function () {
      setBiasMode(2, 'biasPowBtn');
    });

    document.getElementById('biasSineBtn').addEventListener('click', function () {
      setBiasMode(3, 'biasSineBtn');
    });

    // Segments slider
    document.getElementById('segmentsSlider').addEventListener('input', function (e) {
      appState.kaleidoSegments = parseInt(e.target.value);
      document.getElementById('segmentsValue').textContent = appState.kaleidoSegments;
      render();
    });

    // Straighten mode buttons
    function setStraightenMode(mode, buttonId) {
      appState.straightenMode = mode;
      document.querySelectorAll('#straightenToggle .mode-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(buttonId).classList.add('active');
      render();
    }

    document.getElementById('straightenOffBtn').addEventListener('click', function () {
      setStraightenMode(0, 'straightenOffBtn');
    });

    document.getElementById('straightenHorizBtn').addEventListener('click', function () {
      setStraightenMode(1, 'straightenHorizBtn');
    });

    document.getElementById('straightenVertBtn').addEventListener('click', function () {
      setStraightenMode(2, 'straightenVertBtn');
    });

    document.getElementById('straightenAutoBtn').addEventListener('click', function () {
      setStraightenMode(3, 'straightenAutoBtn');
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', function (e) {
      // Ignore if typing in input fields
      if (e.target.tagName === 'INPUT') return;

      const key = e.key.toLowerCase();

      if (key === 'm') {
        // Cycle through mirror modes
        const nextMode = (appState.mirrorMode + 1) % 5;
        const buttons = ['outInBtn', 'inOutBtn', 'quadInBtn', 'quadOutBtn', 'kaleidoBtn'];
        setMirrorMode(nextMode, buttons[nextMode]);
      } else if (key === 'e') {
        // Cycle through edge modes
        const nextMode = (appState.edgeMode + 1) % 3;
        const buttons = ['edgeClampBtn', 'edgeWrapBtn', 'edgeMirrorBtn'];
        setEdgeMode(nextMode, buttons[nextMode]);
      } else if (key === 's') {
        // Cycle through straighten modes
        const nextMode = (appState.straightenMode + 1) % 4;
        const buttons = ['straightenOffBtn', 'straightenHorizBtn', 'straightenVertBtn', 'straightenAutoBtn'];
        setStraightenMode(nextMode, buttons[nextMode]);
      } else if (key === 'b') {
        // Cycle through bias modes
        const nextMode = (appState.biasMode + 1) % 4;
        const buttons = ['biasLinearBtn', 'biasSqrtBtn', 'biasPowBtn', 'biasSineBtn'];
        setBiasMode(nextMode, buttons[nextMode]);
      }
    });

    canvas.addEventListener('mousedown', function (e) {
      if (!appState.image) return;
      if (e.button !== 0) return; // Only respond to left-click

      // Hide instruction overlay
      document.getElementById('instructionOverlay').classList.add('hidden');

      const coords = getCanvasCoordinates(canvas, e.clientX, e.clientY);
      appState.lineStart = coords;
      appState.lineEnd = coords;
      appState.isDrawingLine = true;
      appState.hasLine = false;
      render();
    });

    canvas.addEventListener('mousemove', function (e) {
      if (!appState.isDrawingLine) return;

      const coords = getCanvasCoordinates(canvas, e.clientX, e.clientY);
      appState.lineEnd = coords;
      render();
    });

    canvas.addEventListener('mouseup', function (e) {
      if (!appState.isDrawingLine) return;

      appState.isDrawingLine = false;
      appState.hasLine = true;
      render();
    });

    canvas.addEventListener('mouseleave', function (e) {
      if (appState.isDrawingLine) {
        appState.isDrawingLine = false;
        appState.hasLine = true;
        render();
      }
    });

    canvas.addEventListener('touchstart', function (e) {
      e.preventDefault();
      if (!appState.image) return;

      // Hide instruction overlay
      document.getElementById('instructionOverlay').classList.add('hidden');

      const touch = e.touches[0];
      const coords = getCanvasCoordinates(canvas, touch.clientX, touch.clientY);
      appState.lineStart = coords;
      appState.lineEnd = coords;
      appState.isDrawingLine = true;
      appState.hasLine = false;
      render();
    }, {passive: false});

    canvas.addEventListener('touchmove', function (e) {
      e.preventDefault();
      if (!appState.isDrawingLine) return;

      const touch = e.touches[0];
      const coords = getCanvasCoordinates(canvas, touch.clientX, touch.clientY);
      appState.lineEnd = coords;
      render();
    }, {passive: false});

    canvas.addEventListener('touchend', function (e) {
      e.preventDefault();
      if (!appState.isDrawingLine) return;

      appState.isDrawingLine = false;
      appState.hasLine = true;
      render();
    }, {passive: false});

    window.addEventListener('resize', function () {
      if (appState.image) {
        resizeCanvasToImage(appState.image);
        render();
      }
    });

    // Drag and drop support
    let dragCounter = 0;

    document.body.addEventListener('dragenter', function (e) {
      e.preventDefault();
      dragCounter++;
      document.body.classList.add('dragging');
    });

    document.body.addEventListener('dragover', function (e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });

    document.body.addEventListener('dragleave', function (e) {
      e.preventDefault();
      dragCounter--;
      if (dragCounter === 0) {
        document.body.classList.remove('dragging');
      }
    });

    document.body.addEventListener('drop', function (e) {
      e.preventDefault();
      dragCounter = 0;
      document.body.classList.remove('dragging');

      const files = e.dataTransfer.files;
      if (files.length > 0 && files[0].type.startsWith('image/')) {
        loadImage(files[0]);
      }
    });
  }

  function drawLineOverlay() {
    const canvas = document.getElementById('lineOverlay');
    const ctx = canvas.getContext('2d');

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!appState.lineStart || !appState.lineEnd) return;
    if (!appState.isDrawingLine) return;

    ctx.strokeStyle = '#00ff41';
    ctx.lineWidth = 2;
    ctx.lineCap = 'square';

    ctx.beginPath();
    ctx.moveTo(appState.lineStart.x, appState.lineStart.y);
    ctx.lineTo(appState.lineEnd.x, appState.lineEnd.y);
    ctx.stroke();

    ctx.fillStyle = '#00ff41';
    ctx.fillRect(appState.lineStart.x - 3, appState.lineStart.y - 3, 6, 6);
    ctx.fillRect(appState.lineEnd.x - 3, appState.lineEnd.y - 3, 6, 6);
  }

  function render() {
    const gl = appState.gl;
    if (!gl || !appState.program) return;

    gl.clearColor(0.0, 0.0, 0.0, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    if (!appState.image || !appState.texture) {
      return;
    }

    gl.useProgram(appState.program);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, appState.texture);
    gl.uniform1i(appState.uniforms.image, 0);

    gl.uniform2f(appState.uniforms.canvasSize, appState.canvasWidth, appState.canvasHeight);
    gl.uniform1i(appState.uniforms.mirrorMode, appState.mirrorMode);
    gl.uniform1i(appState.uniforms.edgeMode, appState.edgeMode);
    gl.uniform1f(appState.uniforms.zoom, appState.zoom);
    gl.uniform1f(appState.uniforms.bias, Math.pow(2, appState.bias));
    gl.uniform1i(appState.uniforms.biasMode, appState.biasMode);
    gl.uniform1i(appState.uniforms.kaleidoSegments, appState.kaleidoSegments);

    // Calculate center offset for kaleido + auto mode (center pattern in viewport)
    let centerOffsetX = 0;
    let centerOffsetY = 0;
    if (appState.mirrorMode === 4 && appState.straightenMode === 3 && appState.lineStart && appState.lineEnd) {
      const startY = appState.canvasHeight - appState.lineStart.y;
      const endY = appState.canvasHeight - appState.lineEnd.y;
      const midX = (appState.lineStart.x + appState.lineEnd.x) / 2;
      const midY = (startY + endY) / 2;
      centerOffsetX = appState.canvasWidth / 2 - midX;
      centerOffsetY = appState.canvasHeight / 2 - midY;
    }
    gl.uniform2f(appState.uniforms.centerOffset, centerOffsetX, centerOffsetY);

    // Calculate rotation angle based on straighten mode
    let rotationAngle = 0.0;
    if (appState.straightenMode > 0 && appState.lineStart && appState.lineEnd) {
      const dx = appState.lineEnd.x - appState.lineStart.x;
      const dy = appState.lineEnd.y - appState.lineStart.y;
      const lineAngle = Math.atan2(dy, dx);

      if (appState.straightenMode === 1) {
        // Horizontal: rotate to make line horizontal
        rotationAngle = -lineAngle;
      } else if (appState.straightenMode === 2) {
        // Vertical: rotate to make line vertical
        rotationAngle = -lineAngle + Math.PI / 2;
      } else if (appState.straightenMode === 3) {
        // Auto: choose horizontal or vertical based on line orientation
        if (Math.abs(dx) > Math.abs(dy)) {
          // Line is more horizontal
          rotationAngle = -lineAngle;
        } else {
          // Line is more vertical
          rotationAngle = -lineAngle + Math.PI / 2;
        }
      }
    }
    gl.uniform1f(appState.uniforms.rotationAngle, rotationAngle);

    if (appState.lineStart && appState.lineEnd) {
      const startY = appState.canvasHeight - appState.lineStart.y;
      const endY = appState.canvasHeight - appState.lineEnd.y;

      gl.uniform2f(appState.uniforms.lineStart, appState.lineStart.x, startY);
      gl.uniform2f(appState.uniforms.lineEnd, appState.lineEnd.x, endY);
      gl.uniform1i(appState.uniforms.hasLine, appState.hasLine || appState.isDrawingLine ? 1 : 0);
    } else {
      gl.uniform1i(appState.uniforms.hasLine, 0);
    }

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    drawLineOverlay();
  }

  function init() {
    const canvas = document.getElementById('glCanvas');

    const contextOptions = {
      antialias: true,
      alpha: false,
      premultipliedAlpha: false
    };

    // Try WebGL2 first (supports NPOT mipmaps), fallback to WebGL1
    const gl = canvas.getContext('webgl2', contextOptions) ||
      canvas.getContext('webgl', contextOptions) ||
      canvas.getContext('experimental-webgl', contextOptions);
    if (!gl) {
      alert('WebGL is not supported in your browser. Please use a modern browser.');
      return;
    }
    appState.gl = gl;
    appState.isWebGL2 = gl instanceof WebGL2RenderingContext;

    const vertexShaderSource = document.getElementById('vertex-shader').textContent;
    const fragmentShaderSource = document.getElementById('fragment-shader').textContent;

    const vertexShader = compileShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
    const fragmentShader = compileShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

    if (!vertexShader || !fragmentShader) {
      alert('Failed to compile shaders. Check the console for errors.');
      return;
    }

    appState.program = createProgram(gl, vertexShader, fragmentShader);
    if (!appState.program) {
      alert('Failed to create WebGL program. Check the console for errors.');
      return;
    }

    gl.useProgram(appState.program);

    setupGeometry(gl, appState.program);

    appState.uniforms = {
      image: gl.getUniformLocation(appState.program, 'u_image'),
      lineStart: gl.getUniformLocation(appState.program, 'u_lineStart'),
      lineEnd: gl.getUniformLocation(appState.program, 'u_lineEnd'),
      canvasSize: gl.getUniformLocation(appState.program, 'u_canvasSize'),
      mirrorMode: gl.getUniformLocation(appState.program, 'u_mirrorMode'),
      edgeMode: gl.getUniformLocation(appState.program, 'u_edgeMode'),
      zoom: gl.getUniformLocation(appState.program, 'u_zoom'),
      bias: gl.getUniformLocation(appState.program, 'u_bias'),
      biasMode: gl.getUniformLocation(appState.program, 'u_biasMode'),
      rotationAngle: gl.getUniformLocation(appState.program, 'u_rotationAngle'),
      kaleidoSegments: gl.getUniformLocation(appState.program, 'u_kaleidoSegments'),
      hasLine: gl.getUniformLocation(appState.program, 'u_hasLine'),
      centerOffset: gl.getUniformLocation(appState.program, 'u_centerOffset')
    };

    setupEventListeners(canvas);

    render();
  }

  window.addEventListener('load', init);
</script>
</body>
</html>
