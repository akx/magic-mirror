<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRROR</title>
    <style>
      :root {
        --neon: #ff7300;
        --black: #000000;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 12px;
        background: var(--black);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 36px;
        color: var(--neon);
      }

      body.dragging {
        background: #001a00;
        outline: 4px solid var(--neon);
        outline-offset: -4px;
      }

      #controls {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: var(--black);
        padding: 3px;
        border-bottom: 1px solid var(--neon);
        z-index: 10;
        display: flex;
        flex-direction: row;
        gap: 12px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
      }

      .file-input-wrapper {
        position: relative;
        overflow: hidden;
        display: inline-block;
      }

      #imageInput {
        position: absolute;
        left: -9999px;
      }

      .file-input-label {
        display: block;
        padding: 4px;
        background: var(--black);
        color: var(--neon);
        font-weight: 700;
        font-size: inherit;
        border: 1px solid var(--neon);
        cursor: pointer;
        transition: all 0.1s;
        text-transform: uppercase;
      }

      .file-input-label:hover {
        background: var(--neon);
        color: var(--black);
      }

      #modeToggle, #edgeToggle {
        display: flex;
        flex-wrap: nowrap;
        gap: 5px;
        align-items: center;
      }

      .mode-btn {
        padding: 4px 8px;
        background: var(--black);
        border: 1px solid var(--neon);
        color: var(--neon);
        font-weight: 400;
        font-size: inherit;
        cursor: pointer;
        transition: all 0.1s;
        text-transform: uppercase;
        font-family: 'JetBrains Mono', monospace;
        white-space: nowrap;
      }

      .mode-btn:hover {
        background: var(--neon);
        color: var(--black);
      }

      .mode-btn.active {
        background: var(--neon);
        color: var(--black);
      }

      #zoomControl {
        display: flex;
        flex-direction: row;
        gap: 5px;
        align-items: center;
      }

      #zoomControl label {
        font-size: inherit;
        text-transform: uppercase;
        color: var(--neon);
        white-space: nowrap;
      }

      #zoomSlider {
        width: 100px;
        height: 2px;
        background: var(--neon);
        outline: none;
        -webkit-appearance: none;
        appearance: none;
      }

      #zoomSlider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px;
        height: 12px;
        background: var(--neon);
        cursor: pointer;
        border: none;
      }

      #zoomSlider::-moz-range-thumb {
        width: 12px;
        height: 12px;
        background: var(--neon);
        cursor: pointer;
        border: none;
      }

      #canvasContainer {
        position: relative;
        display: inline-block;
        border: 1px solid var(--neon);
      }

      #glCanvas {
        display: block;
        max-width: 100vw;
        max-height: calc(100vh - 36px);
        background: var(--black);
      }

      #lineOverlay {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
      }

      #instructionOverlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: var(--neon);
        text-transform: uppercase;
        pointer-events: none;
        opacity: 1;
        text-align: center;
        padding: 10px 20px;
        border: 1px solid var(--neon);
        background: rgba(0, 0, 0, 0.9);
      }

      .hidden {
        display: none;
      }

    </style>
</head>
<body>
<div id="controls">
    <div class="file-input-wrapper">
        <input type="file" id="imageInput" accept="image/*">
        <label for="imageInput" class="file-input-label">Choose image</label>
    </div>
    <div id="modeToggle">
        <button id="outInBtn" class="mode-btn active">Out → In</button>
        <button id="inOutBtn" class="mode-btn">In → Out</button>
        <button id="quadInBtn" class="mode-btn">Quad In</button>
        <button id="quadOutBtn" class="mode-btn">Quad Out</button>
    </div>
    <div id="edgeToggle">
        <button id="edgeClampBtn" class="mode-btn active">Clamp</button>
        <button id="edgeWrapBtn" class="mode-btn">Wrap</button>
        <button id="edgeMirrorBtn" class="mode-btn">Mirror</button>
    </div>
    <div id="zoomControl">
        <label for="zoomSlider">Zoom: <span id="zoomValue">1.0</span>x</label>
        <input type="range" id="zoomSlider" min="0.1" max="5.0" step="0.1" value="1.0">
    </div>
</div>

<div id="canvasContainer">
    <canvas id="glCanvas" width="800" height="600"></canvas>
    <canvas id="lineOverlay" width="800" height="600"></canvas>
    <div id="instructionOverlay" class="hidden">Drag to draw mirror line</div>
</div>

<!-- Vertex Shader -->
<script id="vertex-shader" type="x-shader/x-vertex">
    attribute vec2 a_position;
    attribute vec2 a_texCoord;

    varying vec2 v_texCoord;

    void main() {
        gl_Position = vec4(a_position, 0.0, 1.0);
        v_texCoord = a_texCoord;
    }
</script>

<!-- Fragment Shader -->
<script id="fragment-shader" type="x-shader/x-fragment">
    precision highp float;

    uniform sampler2D u_image;
    uniform vec2 u_lineStart;
    uniform vec2 u_lineEnd;
    uniform vec2 u_canvasSize;
    uniform int u_mirrorMode;
    uniform int u_edgeMode;
    uniform float u_zoom;
    uniform bool u_hasLine;

    varying vec2 v_texCoord;

    void main() {
        if (!u_hasLine) {
            gl_FragColor = texture2D(u_image, v_texCoord);
            return;
        }

        // Convert current texture coordinate to pixel space (square space)
        vec2 currentPixel = v_texCoord * u_canvasSize;

        // Line coordinates are already in pixel space
        vec2 lineVec = u_lineEnd - u_lineStart;
        float lineLength = length(lineVec);

        if (lineLength < 0.1) {
            gl_FragColor = texture2D(u_image, v_texCoord);
            return;
        }

        // Calculate line direction and perpendicular normal in pixel space
        vec2 lineDir = lineVec / lineLength;
        vec2 lineNormal = vec2(-lineDir.y, lineDir.x);
        vec2 lineMidpoint = (u_lineStart + u_lineEnd) / 2.0;

        // Apply zoom centered on the line midpoint
        vec2 offset = currentPixel - lineMidpoint;
        currentPixel = lineMidpoint + offset / u_zoom;

        // Calculate signed distance from current pixel to primary line
        float dist = dot(currentPixel - u_lineStart, lineNormal);

        vec2 workingPixel = currentPixel;

        // Mode 0: Out → In, Mode 1: In → Out (simple mirror)
        // Mode 2: Quad In, Mode 3: Quad Out
        bool isQuadMode = (u_mirrorMode >= 2);

        if (!isQuadMode) {
            // Simple mirror modes (0 and 1)
            bool shouldMirror = false;
            if (u_mirrorMode == 0) {
                shouldMirror = (dist > 0.0);
            } else {
                shouldMirror = (dist < 0.0);
            }

            if (shouldMirror) {
                workingPixel = currentPixel - 2.0 * dist * lineNormal;
            }
        } else {
            // Quad mirror modes
            // First, mirror across primary line based on mode
            if (u_mirrorMode == 2) {
                // Quad In: mirror negative side to positive
                if (dist < 0.0) {
                    workingPixel = currentPixel - 2.0 * dist * lineNormal;
                }
            } else if (u_mirrorMode == 3) {
                // Quad Out: mirror positive side to negative
                if (dist > 0.0) {
                    workingPixel = currentPixel - 2.0 * dist * lineNormal;
                }
            }

            // Now mirror across perpendicular axis through midpoint
            float perpDist = dot(workingPixel - lineMidpoint, lineDir);

            if (u_mirrorMode == 3) {
                // Mirror positive perpendicular side to negative
                if (perpDist > 0.0) {
                    workingPixel = workingPixel - 2.0 * perpDist * lineDir;
                }
            } else if (u_mirrorMode == 2) {
                // Mirror negative perpendicular side to positive
                if (perpDist < 0.0) {
                    workingPixel = workingPixel - 2.0 * perpDist * lineDir;
                }
            }
        }

        // Convert back to texture coordinates
        vec2 sampleCoord = workingPixel / u_canvasSize;

        // Apply edge mode
        // Mode 0: Clamp, Mode 1: Wrap, Mode 2: Mirror
        if (u_edgeMode == 0) {
            // Clamp
            sampleCoord = clamp(sampleCoord, 0.0, 1.0);
        } else if (u_edgeMode == 1) {
            // Wrap
            sampleCoord = fract(sampleCoord);
        } else if (u_edgeMode == 2) {
            // Mirror
            sampleCoord = 1.0 - abs(mod(sampleCoord, 2.0) - 1.0);
        }

        gl_FragColor = texture2D(u_image, sampleCoord);
    }
</script>

<script>
  const appState = {
    gl: null,
    program: null,
    image: null,
    texture: null,

    lineStart: null,
    lineEnd: null,
    isDrawingLine: false,
    hasLine: false,

    mirrorMode: 0,
    edgeMode: 0,
    zoom: 1.0,

    uniforms: {},

    canvasWidth: 0,
    canvasHeight: 0
  };

  function compileShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);

    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      console.error('Shader compilation error:', gl.getShaderInfoLog(shader));
      gl.deleteShader(shader);
      return null;
    }
    return shader;
  }

  function createProgram(gl, vertexShader, fragmentShader) {
    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);

    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      console.error('Program linking error:', gl.getProgramInfoLog(program));
      return null;
    }
    return program;
  }

  function setupGeometry(gl, program) {
    const positions = new Float32Array([
      -1, -1,
      1, -1,
      -1, 1,
      1, 1
    ]);

    const texCoords = new Float32Array([
      0, 0,
      1, 0,
      0, 1,
      1, 1
    ]);

    const positionBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

    const positionLoc = gl.getAttribLocation(program, 'a_position');
    gl.enableVertexAttribArray(positionLoc);
    gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

    const texCoordBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, texCoordBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, texCoords, gl.STATIC_DRAW);

    const texCoordLoc = gl.getAttribLocation(program, 'a_texCoord');
    gl.enableVertexAttribArray(texCoordLoc);
    gl.vertexAttribPointer(texCoordLoc, 2, gl.FLOAT, false, 0, 0);
  }

  function loadImage(file) {
    const reader = new FileReader();
    reader.onload = function (e) {
      const img = new Image();
      img.onload = function () {
        appState.image = img;
        resizeCanvasToImage(img);
        createTexture(appState.gl, img);

        appState.hasLine = false;
        appState.lineStart = null;
        appState.lineEnd = null;

        // Show instruction overlay
        document.getElementById('instructionOverlay').classList.remove('hidden');

        render();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function createTexture(gl, image) {
    if (appState.texture) {
      gl.deleteTexture(appState.texture);
    }

    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);

    // Flip Y axis so texture coordinates match WebGL coordinate system
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

    appState.texture = texture;
  }

  function resizeCanvasToImage(img) {
    const canvas = document.getElementById('glCanvas');
    const overlay = document.getElementById('lineOverlay');
    const maxWidth = window.innerWidth;
    const maxHeight = window.innerHeight - 36;

    // Calculate display size (CSS size)
    let displayWidth = img.width;
    let displayHeight = img.height;

    if (displayWidth > maxWidth || displayHeight > maxHeight) {
      const scale = Math.min(maxWidth / displayWidth, maxHeight / displayHeight);
      displayWidth = Math.floor(displayWidth * scale);
      displayHeight = Math.floor(displayHeight * scale);
    }

    // Get device pixel ratio for HiDPI displays
    const dpr = window.devicePixelRatio || 1;

    // Set canvas internal resolution to match display size * DPR (capped at image size)
    const internalWidth = Math.min(Math.floor(displayWidth * dpr), img.width);
    const internalHeight = Math.min(Math.floor(displayHeight * dpr), img.height);

    canvas.width = internalWidth;
    canvas.height = internalHeight;
    overlay.width = internalWidth;
    overlay.height = internalHeight;

    // Set CSS display size
    canvas.style.width = displayWidth + 'px';
    canvas.style.height = displayHeight + 'px';
    overlay.style.width = displayWidth + 'px';
    overlay.style.height = displayHeight + 'px';

    appState.canvasWidth = internalWidth;
    appState.canvasHeight = internalHeight;

    appState.gl.viewport(0, 0, internalWidth, internalHeight);
  }

  function getCanvasCoordinates(canvas, clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    // Convert from CSS pixels to canvas internal pixels
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }

  function setupEventListeners(canvas) {
    document.getElementById('imageInput').addEventListener('change', function (e) {
      if (e.target.files.length > 0) {
        loadImage(e.target.files[0]);
      }
    });

    // Mode button helper function
    function setMirrorMode(mode, buttonId) {
      appState.mirrorMode = mode;
      // Remove active class from mirror mode buttons
      document.querySelectorAll('#modeToggle .mode-btn').forEach(btn => btn.classList.remove('active'));
      // Add active class to clicked button
      document.getElementById(buttonId).classList.add('active');
      render();
    }

    function setEdgeMode(mode, buttonId) {
      appState.edgeMode = mode;
      // Remove active class from edge mode buttons
      document.querySelectorAll('#edgeToggle .mode-btn').forEach(btn => btn.classList.remove('active'));
      // Add active class to clicked button
      document.getElementById(buttonId).classList.add('active');
      render();
    }

    document.getElementById('outInBtn').addEventListener('click', function () {
      setMirrorMode(0, 'outInBtn');
    });

    document.getElementById('inOutBtn').addEventListener('click', function () {
      setMirrorMode(1, 'inOutBtn');
    });

    document.getElementById('quadInBtn').addEventListener('click', function () {
      setMirrorMode(2, 'quadInBtn');
    });

    document.getElementById('quadOutBtn').addEventListener('click', function () {
      setMirrorMode(3, 'quadOutBtn');
    });

    document.getElementById('edgeClampBtn').addEventListener('click', function () {
      setEdgeMode(0, 'edgeClampBtn');
    });

    document.getElementById('edgeWrapBtn').addEventListener('click', function () {
      setEdgeMode(1, 'edgeWrapBtn');
    });

    document.getElementById('edgeMirrorBtn').addEventListener('click', function () {
      setEdgeMode(2, 'edgeMirrorBtn');
    });

    // Zoom slider
    document.getElementById('zoomSlider').addEventListener('input', function (e) {
      appState.zoom = parseFloat(e.target.value);
      document.getElementById('zoomValue').textContent = appState.zoom.toFixed(1);
      render();
    });

    canvas.addEventListener('mousedown', function (e) {
      if (!appState.image) return;
      if (e.button !== 0) return; // Only respond to left-click

      // Hide instruction overlay
      document.getElementById('instructionOverlay').classList.add('hidden');

      const coords = getCanvasCoordinates(canvas, e.clientX, e.clientY);
      appState.lineStart = coords;
      appState.lineEnd = coords;
      appState.isDrawingLine = true;
      appState.hasLine = false;
      render();
    });

    canvas.addEventListener('mousemove', function (e) {
      if (!appState.isDrawingLine) return;

      const coords = getCanvasCoordinates(canvas, e.clientX, e.clientY);
      appState.lineEnd = coords;
      render();
    });

    canvas.addEventListener('mouseup', function (e) {
      if (!appState.isDrawingLine) return;

      appState.isDrawingLine = false;
      appState.hasLine = true;
      render();
    });

    canvas.addEventListener('mouseleave', function (e) {
      if (appState.isDrawingLine) {
        appState.isDrawingLine = false;
        appState.hasLine = true;
        render();
      }
    });

    canvas.addEventListener('touchstart', function (e) {
      e.preventDefault();
      if (!appState.image) return;

      // Hide instruction overlay
      document.getElementById('instructionOverlay').classList.add('hidden');

      const touch = e.touches[0];
      const coords = getCanvasCoordinates(canvas, touch.clientX, touch.clientY);
      appState.lineStart = coords;
      appState.lineEnd = coords;
      appState.isDrawingLine = true;
      appState.hasLine = false;
      render();
    }, {passive: false});

    canvas.addEventListener('touchmove', function (e) {
      e.preventDefault();
      if (!appState.isDrawingLine) return;

      const touch = e.touches[0];
      const coords = getCanvasCoordinates(canvas, touch.clientX, touch.clientY);
      appState.lineEnd = coords;
      render();
    }, {passive: false});

    canvas.addEventListener('touchend', function (e) {
      e.preventDefault();
      if (!appState.isDrawingLine) return;

      appState.isDrawingLine = false;
      appState.hasLine = true;
      render();
    }, {passive: false});

    window.addEventListener('resize', function () {
      if (appState.image) {
        resizeCanvasToImage(appState.image);
        render();
      }
    });

    // Drag and drop support
    let dragCounter = 0;

    document.body.addEventListener('dragenter', function (e) {
      e.preventDefault();
      dragCounter++;
      document.body.classList.add('dragging');
    });

    document.body.addEventListener('dragover', function (e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });

    document.body.addEventListener('dragleave', function (e) {
      e.preventDefault();
      dragCounter--;
      if (dragCounter === 0) {
        document.body.classList.remove('dragging');
      }
    });

    document.body.addEventListener('drop', function (e) {
      e.preventDefault();
      dragCounter = 0;
      document.body.classList.remove('dragging');

      const files = e.dataTransfer.files;
      if (files.length > 0 && files[0].type.startsWith('image/')) {
        loadImage(files[0]);
      }
    });
  }

  function drawLineOverlay() {
    const canvas = document.getElementById('lineOverlay');
    const ctx = canvas.getContext('2d');

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!appState.lineStart || !appState.lineEnd) return;
    if (!appState.isDrawingLine) return;

    ctx.strokeStyle = '#00ff41';
    ctx.lineWidth = 2;
    ctx.lineCap = 'square';

    ctx.beginPath();
    ctx.moveTo(appState.lineStart.x, appState.lineStart.y);
    ctx.lineTo(appState.lineEnd.x, appState.lineEnd.y);
    ctx.stroke();

    ctx.fillStyle = '#00ff41';
    ctx.fillRect(appState.lineStart.x - 3, appState.lineStart.y - 3, 6, 6);
    ctx.fillRect(appState.lineEnd.x - 3, appState.lineEnd.y - 3, 6, 6);
  }

  function render() {
    const gl = appState.gl;
    if (!gl || !appState.program) return;

    gl.clearColor(0.0, 0.0, 0.0, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    if (!appState.image || !appState.texture) {
      return;
    }

    gl.useProgram(appState.program);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, appState.texture);
    gl.uniform1i(appState.uniforms.image, 0);

    gl.uniform2f(appState.uniforms.canvasSize, appState.canvasWidth, appState.canvasHeight);
    gl.uniform1i(appState.uniforms.mirrorMode, appState.mirrorMode);
    gl.uniform1i(appState.uniforms.edgeMode, appState.edgeMode);
    gl.uniform1f(appState.uniforms.zoom, appState.zoom);

    if (appState.lineStart && appState.lineEnd) {
      const startY = appState.canvasHeight - appState.lineStart.y;
      const endY = appState.canvasHeight - appState.lineEnd.y;

      gl.uniform2f(appState.uniforms.lineStart, appState.lineStart.x, startY);
      gl.uniform2f(appState.uniforms.lineEnd, appState.lineEnd.x, endY);
      gl.uniform1i(appState.uniforms.hasLine, appState.hasLine || appState.isDrawingLine ? 1 : 0);
    } else {
      gl.uniform1i(appState.uniforms.hasLine, 0);
    }

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    drawLineOverlay();
  }

  function init() {
    const canvas = document.getElementById('glCanvas');

    const contextOptions = {
      antialias: true,
      alpha: false,
      premultipliedAlpha: false
    };

    // Try WebGL2 first (supports NPOT mipmaps), fallback to WebGL1
    const gl = canvas.getContext('webgl2', contextOptions) ||
      canvas.getContext('webgl', contextOptions) ||
      canvas.getContext('experimental-webgl', contextOptions);
    if (!gl) {
      alert('WebGL is not supported in your browser. Please use a modern browser.');
      return;
    }
    appState.gl = gl;
    appState.isWebGL2 = gl instanceof WebGL2RenderingContext;

    const vertexShaderSource = document.getElementById('vertex-shader').textContent;
    const fragmentShaderSource = document.getElementById('fragment-shader').textContent;

    const vertexShader = compileShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
    const fragmentShader = compileShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);

    if (!vertexShader || !fragmentShader) {
      alert('Failed to compile shaders. Check the console for errors.');
      return;
    }

    appState.program = createProgram(gl, vertexShader, fragmentShader);
    if (!appState.program) {
      alert('Failed to create WebGL program. Check the console for errors.');
      return;
    }

    gl.useProgram(appState.program);

    setupGeometry(gl, appState.program);

    appState.uniforms = {
      image: gl.getUniformLocation(appState.program, 'u_image'),
      lineStart: gl.getUniformLocation(appState.program, 'u_lineStart'),
      lineEnd: gl.getUniformLocation(appState.program, 'u_lineEnd'),
      canvasSize: gl.getUniformLocation(appState.program, 'u_canvasSize'),
      mirrorMode: gl.getUniformLocation(appState.program, 'u_mirrorMode'),
      edgeMode: gl.getUniformLocation(appState.program, 'u_edgeMode'),
      zoom: gl.getUniformLocation(appState.program, 'u_zoom'),
      hasLine: gl.getUniformLocation(appState.program, 'u_hasLine')
    };

    setupEventListeners(canvas);

    render();
  }

  window.addEventListener('load', init);
</script>
</body>
</html>
